apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-demo
  labels:
    app: memory-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory-demo
  template:
    metadata:
      labels:
        app: memory-demo
    spec:
      containers:
        - name: memory-demo
          image: python:3.12-alpine
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"   # dinaikkan dikit biar ada headroom, gak langsung OOM saat burst
              cpu: "300m"
          volumeMounts:
            - name: app-code
              mountPath: /app
      volumes:
        - name: app-code
          configMap:
            name: memory-demo-app